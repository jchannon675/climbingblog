
<div class="blog-search">
    <label for="blog-search-input">Search posts</label>
    <input
        id="blog-search-input"
        type="search"
        placeholder="Search all posts..."
        autocomplete="off"
    >
    <p id="blog-search-status" aria-live="polite">
        Enter a search term to search posts.
    </p>
    <ul id="blog-search-results"></ul>
</div>

<script>
(async function () {
    const input = document.getElementById('blog-search-input');
    const status = document.getElementById('blog-search-status');
    const results = document.getElementById('blog-search-results');

    let posts = [];

    try {
        const response = await fetch('{{ "index.json" | relURL }}');
        if (!response.ok) throw new Error('Could not load search index');
        posts = await response.json();
    } catch (error) {
        status.textContent = 'Search is currently unavailable.';
        return;
    }

    input.addEventListener('input', function () {
        const query = input.value.trim().toLowerCase();
        results.replaceChildren();

        if (!query) {
            status.textContent = 'Enter a search term to search posts.';
            return;
        }

        const matches = posts.filter(post =>
            (post.title + ' ' + post.content)
                .toLowerCase()
                .includes(query)
        );

        if (matches.length === 0) {
            status.textContent = 'Nothing found.';
            return;
        }

        status.textContent =
            matches.length + ' result' +
            (matches.length === 1 ? '' : 's') + ' found.';

        matches.forEach(post => {
            const li = document.createElement('li');
            const link = document.createElement('a');

            link.href = post.url;
            link.textContent = post.title;

            li.appendChild(link);

            const date = document.createElement('small');
            date.textContent = ' — ' + post.date;
            li.appendChild(date);

            results.appendChild(li);
        });
    });
})();
</script>
